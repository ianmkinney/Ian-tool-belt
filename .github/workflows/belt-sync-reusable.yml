name: belt sync (reusable)
on:
  workflow_call:
    secrets:
      BELT_SYNC_TOKEN:
        description: Optional fine-grained PAT (Contents, Pull requests, Workflows write) so sync PRs run CI and can update workflow files.
        required: false
      RELEASE_PLEASE_TOKEN:
        description: Used when BELT_SYNC_TOKEN is not set.
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BELT_SYNC_TOKEN || secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ianmkinney/Ian-tool-belt
          ref: main
          path: .tool-belt-upstream
          sparse-checkout: |
            templates/app-adoption
            scripts
      - id: sync
        env:
          HAS_SYNC_TOKEN: ${{ secrets.BELT_SYNC_TOKEN != '' || secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          flags=()
          if [ "$HAS_SYNC_TOKEN" = "true" ]; then flags+=(--allow-workflow-files); fi
          python3 .tool-belt-upstream/scripts/belt_sync.py --belt .tool-belt-upstream --app . \
            --body "$RUNNER_TEMP/belt-sync-body.md" "${flags[@]}"
      - if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BELT_SYNC_TOKEN || secrets.RELEASE_PLEASE_TOKEN || github.token }}
          branch: tool-belt/sync
          draft: true
          title: 'chore: sync tool belt to v${{ steps.sync.outputs.version }}'
          commit-message: 'chore: sync tool belt to v${{ steps.sync.outputs.version }}'
          body-path: ${{ runner.temp }}/belt-sync-body.md
          add-paths: ${{ steps.sync.outputs.paths }}
