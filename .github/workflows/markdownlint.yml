name: Markdown lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Read the markdownlint-cli2 pin from belt.json
        id: pin
        run: |
          python3 -c "import json; print('version=' + next(p['version'] for p in json.load(open('belt.json'))['packages'] if p['id'] == 'markdownlint-cli2'))" >> "$GITHUB_OUTPUT"
      - name: Install and run markdownlint-cli2
        env:
          MARKDOWNLINT_CLI2_VERSION: ${{ steps.pin.outputs.version }}
        # Version is the belt.json pin. npm has no lockfile in this repo.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION"
          markdownlint-cli2
