name: Shell script lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read the shellcheck pin from belt.json
        id: pin
        run: |
          python3 -c "import json; print('version=' + next(p['version'] for p in json.load(open('belt.json'))['packages'] if p['id'] == 'shellcheck'))" >> "$GITHUB_OUTPUT"
      - name: Install and run shellcheck
        env:
          SHELLCHECK_PY: ${{ steps.pin.outputs.version }}
        run: |
          python3 -m pip install "shellcheck-py==$SHELLCHECK_PY"
          python3 scripts/check_shell.py --shellcheck "$(command -v shellcheck)"
