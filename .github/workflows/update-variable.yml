name: Update a belt variable
on:
  workflow_dispatch:
    inputs:
      variable:
        description: 'Path to change, e.g. servers.playwright.status, servers.context7.url, packages.playwright-mcp.version, models.local-ai.presets.ollama.model'
        required: true
        type: string
      value:
        description: New value
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: update-variable
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VARIABLE: ${{ inputs.variable }}
      VALUE: ${{ inputs.value }}
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The persisted credential is what `git push` uses below; this job uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply the change (allowlisted paths only; validated or rolled back)
        run: python scripts/belt_set.py belt.json "$VARIABLE" "$VALUE"
      - run: python scripts/validate.py belt.json
      - run: python -m unittest discover -s tests
      - name: Open a pull request
        run: |
          if git diff --quiet; then
            echo "No change; $VARIABLE already has that value." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="belt-update/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Set $VARIABLE in belt.json"
          git push origin "$branch"
          {
            echo "Requested through the **Update a belt variable** workflow by @${GITHUB_ACTOR}."
            echo
            echo '```diff'
            git diff "origin/$BASE" -- belt.json
            echo '```'
            echo
            echo "Validated and unit-tested in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo "PRs opened with GITHUB_TOKEN do not trigger other workflows; push to this branch or close and reopen to run Belt checks."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE" --head "$branch" --title "Set $VARIABLE in belt.json" --body-file "$RUNNER_TEMP/pr-body.md" --draft
