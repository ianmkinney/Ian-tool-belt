name: Pre-commit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # markdownlint-cli2 engines require Node >= 22. The hook uses language_version: system.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Read the pre-commit pin from belt.json
        id: pin
        run: |
          python3 -c "import json; print('version=' + next(p['version'] for p in json.load(open('belt.json'))['packages'] if p['id'] == 'pre-commit'))" >> "$GITHUB_OUTPUT"
      - name: Run pre-commit
        env:
          PRE_COMMIT_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          python3 -m pip install "pre-commit==$PRE_COMMIT_VERSION"
          pre-commit run --all-files
