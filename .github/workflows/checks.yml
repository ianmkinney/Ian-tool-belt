name: Belt checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate.py belt.json
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export.py belt.json --target claude-code --out dist/claude-code
      - run: python scripts/export.py belt.json --target vscode --out dist/vscode
