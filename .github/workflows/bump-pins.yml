name: Check pinned package versions
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bump-pins
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The persisted credential is what `git push` uses below; this job uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Look up newer stable releases and bump pins
        run: |
          python scripts/check_pins.py belt.json --apply --report "$RUNNER_TEMP/pins.json"
          { echo '```json'; cat "$RUNNER_TEMP/pins.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate and test the bump
        run: |
          git diff --quiet && exit 0
          python scripts/validate.py belt.json
          python -m unittest discover -s tests
      - name: Open a pull request when something changed
        run: |
          if git diff --quiet; then
            echo "All pins are current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="belt-pins/$(git diff | sha256sum | cut -c1-12)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Branch $branch already proposes this bump; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump pinned package versions"
          git push origin "$branch"
          {
            echo "The weekly pin check found newer stable releases."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/pins.json"
            echo '```'
            echo
            echo "Review upstream release notes before merging. A pin bump is not a supply-chain review."
            echo "PRs opened with GITHUB_TOKEN do not trigger other workflows; push to this branch or close and reopen to run Belt checks."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE" --head "$branch" --title "Bump pinned package versions" --body-file "$RUNNER_TEMP/pr-body.md" --draft
