name: act version check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the act pin from belt.json
        id: pin
        run: |
          python3 -c "import json; print('version=' + next(p['version'] for p in json.load(open('belt.json'))['packages'] if p['id'] == 'act'))" >> "$GITHUB_OUTPUT"
      # Download and version-check only. Running workflows needs Docker and stays local; see docs/act.md.
      - name: Install pinned act and print its version
        env:
          ACT_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          asset="act_Linux_x86_64.tar.gz"
          base="https://github.com/nektos/act/releases/download/v${ACT_VERSION}"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/checksums.txt"
          grep -F " ${asset}" checksums.txt | sha256sum -c -
          tar -xzf "$asset" act
          version_out="$(./act --version)"
          printf '%s\n' "$version_out"
          expected="act version ${ACT_VERSION}"
          case "$version_out" in
            *"$expected"*) ;;
            *) echo "unexpected act version: ${version_out}" >&2; exit 1 ;;
          esac
