name: belt-sync
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: ianmkinney/Ian-tool-belt/.github/workflows/belt-sync-reusable.yml@__BELT_SHA__ # v__BELT_VERSION__
    with:
      belt-ref: __BELT_SHA__
    secrets:
      BELT_SYNC_TOKEN: ${{ secrets.BELT_SYNC_TOKEN }}
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
