name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: ianmkinney/Ian-tool-belt/.github/workflows/release-please-reusable.yml@__BELT_SHA__ # v__BELT_VERSION__
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
