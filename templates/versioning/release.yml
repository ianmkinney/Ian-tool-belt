name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    # Tracks the tool belt's main on purpose; switch to a tag such as @v1 once one is published.
    uses: ianmkinney/Ian-tool-belt/.github/workflows/release-please-reusable.yml@main # zizmor: ignore[unpinned-uses]
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
